<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Arabesque Border -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.5" stroke-dasharray="12 8" />
  
  <!-- Subtle Mosque Minarets / Dome Structure -->
  <g transform="translate(0, -10)">
    <!-- Central Dome Arch -->
    <path d="M 256 120 C 230 150, 190 190, 190 260 L 322 260 C 322 190, 282 150, 256 120 Z" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Crescent & Star Finial -->
    <path d="M 256 75 C 265 75, 272 82, 272 91 C 272 97, 268 102, 263 105 C 268 105, 275 99, 275 91 C 275 80, 266 71, 255 71 C 253 71, 250 72, 248 73 C 252 74, 256 75, 256 75 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    <polygon points="266,80 268,85 273,85 269,88 271,93 266,90 262,93 264,88 260,85 265,85" fill="url(#goldGrad)" />
    
    <!-- Arch Lines -->
    <path d="M 210 260 C 210 215, 235 185, 256 160 C 277 185, 302 215, 302 260" fill="none" stroke="#022C22" stroke-width="5" />
    <path d="M 230 260 C 230 230, 245 205, 256 190 C 267 205, 282 230, 282 260" fill="#022C22" />

    <!-- Open Holy Quran Book Silhouette -->
    <g transform="translate(256, 330) scale(1.15)">
      <!-- Left Page -->
      <path d="M -8 -10 C -45 -25, -95 -15, -110 5 C -112 25, -100 45, -8 40 Z" fill="#FCFBF7" />
      <path d="M -15 -5 C -45 -18, -85 -10, -98 8 L -98 12 C -85 -5, -45 -12, -15 0 Z" fill="url(#goldGrad)" />
      <!-- Right Page -->
      <path d="M 8 -10 C 45 -25, 95 -15, 110 5 C 112 25, 100 45, 8 40 Z" fill="#FCFBF7" />
      <path d="M 15 -5 C 45 -18, 85 -10, 98 8 L 98 12 C 85 -5, 45 -12, 15 0 Z" fill="url(#goldGrad)" />
      <!-- Rihal / Quran Stand -->
      <polygon points="-50,42 50,42 35,68 -35,68" fill="url(#goldGrad)" opacity="0.9" />
      <polygon points="-30,68 30,68 45,85 -45,85" fill="#B45309" />
    </g>
  </g>

  <!-- Typography: HUFFAZ ETAWAH -->
  <text x="256" y="440" font-family="'Scheherazade New', 'Amiri', 'Traditional Arabic', serif" font-weight="bold" font-size="34" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
    HUFFAZ ETAWAH
  </text>
  <text x="256" y="468" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#A7F3D0" text-anchor="middle" letter-spacing="3">
    DEEN &amp; BAYANAAT
  </text>
</svg>
